<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="A tray context menu with five entries">
  <rect x="190" y="24" width="260" height="258" rx="14" fill="#24272c" stroke="#34383f" stroke-width="1.5"/>

  <g fill="none" stroke="#d3d8e0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- open -->
    <g transform="translate(210,51)">
      <rect x="3.5" y="4.5" width="17" height="15" rx="3"/>
      <path d="M4.5 9.5h15"/>
    </g>
    <!-- restart -->
    <g transform="translate(210,85)">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </g>
    <!-- check for updates -->
    <g transform="translate(210,141)">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M12 15V3"/>
    </g>
    <!-- appearance -->
    <g transform="translate(210,175)">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </g>
    <!-- exit -->
    <g transform="translate(210,231)">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
      <path d="M12 2v10"/>
    </g>
  </g>

  <g fill="#d3d8e0">
    <rect x="252" y="58.5" width="44" height="9" rx="4.5"/>
    <rect x="252" y="92.5" width="58" height="9" rx="4.5"/>
    <rect x="252" y="148.5" width="130" height="9" rx="4.5"/>
    <rect x="252" y="182.5" width="76" height="9" rx="4.5"/>
    <rect x="252" y="238.5" width="32" height="9" rx="4.5"/>
  </g>

  <path d="M406 187l4.5 4.5 9-9.5" fill="none" stroke="#7aa2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#3d424a" stroke-width="1.2">
    <path d="M210 125h220"/>
    <path d="M210 215h220"/>
  </g>
</svg>
